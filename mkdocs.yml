# [Info]
site_name: 羽城的笔记本
site_url: https://note.flyburg.cc/
site_description: Flyburg's Notebook

# [UI]
## [top]
theme:
  name: material
  custom_dir: overrides
  favicon: https://bee-reg-ab.imagency.cn/mr/6175/26/e6d14d2067b418f35d3ee368841390c2.png
  font:
    text: LXGW WenKai Screen
    code: JetBrains Mono
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/auto-fix
        name: 切换至日间模式
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: var(--md-primary-fg-color)
      toggle:
        icon: material/toggle-switch
        name: 切换至夜间模式
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: var(--md-primary-fg-color)
      toggle:
        icon: material/toggle-switch-off-outline
        name: 切换至跟随系统模式
  features:
    - announce.dismiss
    - navigation.tracking   #地址栏中的 URL 将自动更新为在目录中突出显示的活动锚点
    - navigation.tabs # 使用Tab来进行分类
    - navigation.top # 返回顶部的按钮 在上滑时出现
    - navigation.indexes # Tab会有一个index.md 而不是在打开Tab时打开第一篇文章
    # - navigation.footer # 底部的翻页
    # - navigation.expand # 打开Tab时左侧目录全部展开
    # - toc.follow
    - search.share   #搜索分享按钮
    - search.suggest # 搜索输入一些字母时推荐补全整个单词
    - search.highlight # 搜索出的文章关键词加入高亮
    - content.code.copy # 可以通过按钮复制代码
    - content.action.edit # 点击按钮跳转到编辑页面  需要结合 edit_uri 一起使用
  language: zh # 一些提示性的文字会变成中文
  icon:
    repo: fontawesome/brands/git-alt
    logo: material/notebook
edit_uri: edit/main/docs # 编辑按钮跳转的链接

## [top-right corner]
repo_url: https://github.com/Flyburg/notebook # 右上角的GitHub链接
repo_name: Flyburg's Notebook # 鼠标悬浮提示

## [bottom-left corner]
copyright: Copyright &copy; 2023 - 2026 Flyburg

## [bottom-right corner]
extra:
  social: # icons
    - icon: fontawesome/solid/blog
      link: https://flyburg.cc/
      name: Blog
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/85414704
      name: Bilibili # 鼠标悬浮提示
    - icon: fontawesome/brands/github
      link: https://github.com/flyburg
      name: GitHub | Flyburg
    - icon: material/email
      link: mailto:<flyburg@outlook.com>
      name: Email

# [Extensions]
plugins:
  - search:
      separator: '[\s\u200b\-]'
      lang:
        - en
        - ja
  - tags # 给单篇文章添加标签 https://squidfunk.github.io/mkdocs-material/setup/setting-up-tags/?h=tags
  - statistics:
      page_check_metadata: comments
      exclude_path: about/
  - add-number:
      strict_mode: False
      order: 2
      excludes: 
        - application/ads/
        - application/fds/
        - application/ai/
        - application/arch/
        - application/html/

markdown_extensions:
  # - abbr
  - meta
  - def_list
  - attr_list
  # - admonition
  # - footnotes
  - md_in_html
  - sane_lists
  - admonition
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  # - pymdownx.caret
  - pymdownx.critic
  # - pymdownx.betterem
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.inlinehilite
  # - markdown.extensions.attr_list
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      toc_depth: 4  # 将深度从 4 改为 2
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight: # 代码块高亮
      anchor_linenums: true
      # linenums: true # 显示行号
      # auto_title: true # 显示编程语言名称
      linenums_style: pymdownx-inline
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - javascripts/mathjax.js
  - javascripts/article-cards.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
  - stylesheets/document.css
  - stylesheets/friends.css
  - stylesheets/file.css
  - stylesheets/article-cards.css
  - https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.1.0/style.css #字体
  - https://static.zeoseven.com/zsft/92/main/result.css
  - https://cdn.staticfile.org/font-awesome/4.7.0/css/font-awesome.css # font-awesome表情支持


